# pick-model 模型与价目表
#
# 这是 skill 唯一的"事实来源"。改价、加模型都只改这个文件，不用动 SKILL.md。
# 价格单位：USD / 1M tokens。数据来源见 updated 下方注释。
#
# ⚠ fail_rate 是唯一的主观参数：它表示"这一档模型做这类任务时，输出需要重做的概率"。
#   社区默认为经验估计，你应当用自己业务的 eval 结果替换它。改这一个数字，
#   推荐结果会显著变化——这是有意设计的，因为"便宜但常翻车"的模型不该被推荐。

